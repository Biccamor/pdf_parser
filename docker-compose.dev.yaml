services:

  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    mem_limit: "12g"
    shm_size: "1g"

  pdf-parser:
    build: .
    image: pdf-parser
    container_name: pdf-parser
    ports:
      - "8010:8010"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - BIT_SERVER_DATABASE=/parser/bit_server.db
    depends_on:
      - ollama

volumes:
  ollama_data:
